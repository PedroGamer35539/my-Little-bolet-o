<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 8º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho principal com título e subtítulo -->
  <header>
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano | Estudante Exemplo</p>
  </header>

  <main class="container">
    <!-- Área de cards com o resumo de desempenho -->
    <section class="cards-grid">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="media-geral">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="total-faltas">—</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="bom-desempenho">—</p>
      </div>

      <div class="card">
        <h3>Precisa de Atenção</h3>
        <p id="precisa-atencao">—</p>
      </div>

      <div class="card">
        <h3>Frequência</h3>
        <p id="frequencia-geral">—</p>
        <span class="frequencia-texto">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela responsiva de disciplinas -->
    <section class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="tabela-boletim">
          <!-- As linhas das disciplinas serão preenchidas automaticamente pelo JavaScript -->
        </tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
